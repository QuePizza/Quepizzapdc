<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>¡Que Pizza! — Pedidos</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding-bottom:90px}header{text-align:center;padding:18px}.logo{width:150px;max-height:150px;object-fit:contain;border-radius:18px}h1{color:#20d83b}main{max-width:700px;margin:auto;padding:12px}h2{border-bottom:3px solid #20d83b;padding-bottom:6px}.item{background:#171717;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px}button{border:0;border-radius:9px;padding:9px 13px;font-weight:bold}.plus{background:#20d83b}.minus{background:#333;color:#fff}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:9px;border:1px solid #444;background:#111;color:#fff;font-size:16px}.gps{width:100%;background:#20d83b;margin:5px 0 10px}.send{position:fixed;bottom:0;left:0;right:0;padding:15px;background:#25d366;text-align:center;font-weight:bold;font-size:18px;color:#062b11;text-decoration:none}.muted{color:#bbb;font-size:13px}#total{font-size:22px;font-weight:bold}</style></head><body><header><img class="logo" src="logo-que-pizza.jpg" alt="¡Que Pizza!"><h1>¡Que Pizza!</h1><div>Pizza napoletana contemporánea</div><div class="muted">Miércoles a domingo · 17:30 a 22:00 · Solo a domicilio</div></header><main><h2>Tu pedido</h2><div id="menu"></div><h2>Datos de entrega</h2><label>Nombre<input id="name" placeholder="Tu nombre"></label><button class="gps" id="gps">📍 Usar mi ubicación GPS (opcional)</button><div id="gpsmsg" class="muted">Puedes enviar el pedido aunque no uses GPS.</div><label>Dirección<textarea id="address" placeholder="Escribe tu dirección"></textarea></label><label>Notas<textarea id="notes" placeholder="Ej. sin cebolla, tocar el timbre..."></textarea></label><p>Subtotal: <span id="total">$0.00</span></p><p class="muted">🚚 El costo de entrega lo confirma la pizzería. No se calcula automáticamente.</p></main><a id="send" class="send" href="#">🟢 Enviar pedido por WhatsApp</a><script>const M=[['Margherita',150],['Jamon y Hongos',210],['Jamon Serrano',210],['Vegetariana',210],['4 Quesos',210],['Boscaiola',230],['Pepperoni',190],['Hawaiana',200],['Atun y cebolla',210],['Perla',210],['Mediterranea',210],['Toscana',230],['Marina',230],['Fresca',210],['Intensa (Blanca)',230],['Tiramisú',90]];const C=M.map(()=>0);function money(n){return '$'+n.toFixed(2)}function draw(){const e=document.getElementById('menu');e.innerHTML='';M.forEach((x,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div><b>${x[0]}</b><br><span class="muted">${money(x[1])}</span></div><div><button class="minus">−</button> <b>${C[i]}</b> <button class="plus">+</button></div>`;const b=d.querySelectorAll('button');b[0].onclick=()=>{C[i]=Math.max(0,C[i]-1);draw();total()};b[1].onclick=()=>{C[i]++;draw();total()};e.appendChild(d)})}function total(){let t=0;M.forEach((x,i)=>t+=x[1]*C[i]);document.getElementById('total').textContent=money(t);return t}draw();total();let gps='';document.getElementById('gps').onclick=()=>{if(!navigator.geolocation){document.getElementById('gpsmsg').textContent='GPS no disponible en este navegador.';return}document.getElementById('gpsmsg').textContent='Obteniendo ubicación…';navigator.geolocation.getCurrentPosition(p=>{gps=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);document.getElementById('gpsmsg').textContent='✓ GPS obtenido. Se enviará como enlace de Google Maps.'},()=>document.getElementById('gpsmsg').textContent='No se pudo obtener el GPS. Puedes continuar sin él.')};document.getElementById('send').onclick=e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),addr=document.getElementById('address').value.trim(),t=total();if(!name||(!addr&&!gps)||t===0){alert('Completa tu nombre, dirección o GPS, y selecciona al menos un producto.');return}let msg='🍕 *PEDIDO — ¡QUE PIZZA!*\n\n';M.forEach((x,i)=>{if(C[i])msg+=`${C[i]} × ${x[0]} — ${money(C[i]*x[1])}\n`});msg+=`\n*Subtotal:* ${money(t)}\n*Entrega:* por confirmar\n\n👤 *Nombre:* ${name}\n📍 *Dirección:* ${addr}`;if(gps)msg+=`\n🗺️ *GPS:* https://www.google.com/maps?q=${gps}`;let n=document.getElementById('notes').value.trim();if(n)msg+=`\n📝 *Notas:* ${n}`;window.open('https://wa.me/529841408086?text='+encodeURIComponent(msg),'_blank')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
